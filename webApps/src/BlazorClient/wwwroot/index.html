<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatFoundry</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/open-iconic/1.1.1/font/css/open-iconic-bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/replay-node.css" />
    <link rel="stylesheet" href="css/workflow-designer-node.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="BlazorClient.styles.css" rel="stylesheet" />
    <script type="importmap"></script>

    <link href="_content/Z.Blazor.Diagrams/style.min.css" rel="stylesheet" />
    <!-- If you want the default style -->
    <link href="_content/Z.Blazor.Diagrams/default.styles.min.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div class="loading-splash">
            <div class="loading-splash-brand">
                <svg class="loading-splash-logo" width="48" height="48" viewBox="0 0 28 28" fill="none">
                    <rect width="28" height="28" rx="7" fill="url(#load-logo-grad)"/>
                    <path d="M8 10.5C8 9.67 8.67 9 9.5 9H18.5C19.33 9 20 9.67 20 10.5V16.5C20 17.33 19.33 18 18.5 18H13L10 21V18H9.5C8.67 18 8 17.33 8 16.5V10.5Z" fill="white" opacity="0.95"/>
                    <circle cx="12" cy="13.5" r="1" fill="url(#load-logo-grad)"/>
                    <circle cx="16" cy="13.5" r="1" fill="url(#load-logo-grad)"/>
                    <defs>
                        <linearGradient id="load-logo-grad" x1="0" y1="0" x2="28" y2="28">
                            <stop offset="0%" stop-color="#6366f1"/>
                            <stop offset="100%" stop-color="#8b5cf6"/>
                        </linearGradient>
                    </defs>
                </svg>
                <span class="loading-splash-name">ChatFoundry</span>
                <span class="loading-splash-tagline">Визуальный конструктор AI-ботов</span>
            </div>
            <svg class="loading-progress" aria-hidden="true">
                <circle r="40%" cx="50%" cy="50%" />
                <circle r="40%" cx="50%" cy="50%" />
            </svg>
            <div class="loading-progress-text"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/Z.Blazor.Diagrams/script.min.js"></script>
    <script>
        window.__designerZoom = function(containerId, level) {
            var el = document.getElementById(containerId);
            if (!el) return;
            var layer = el.querySelector('.bd-layer') || el.querySelector('[class*="layer"]') || el.querySelector('.designer-canvas > div') || el.firstElementChild;
            if (layer) {
                layer.style.transform = 'scale(' + level + ')';
                layer.style.transformOrigin = '0 0';
            }
        };
        window.__triggerWorkflowJsonFileInput = function() {
            var wrap = document.getElementById('workflow-json-file-wrap');
            if (wrap) {
                var input = wrap.querySelector('input[type=file]');
                if (input) input.click();
            }
        };
        window.__triggerFileDownload = function(url) {
            window.location.href = url;
        };
        window.__downloadWorkflowJson = function(filename, jsonContent) {
            var blob = new Blob([jsonContent], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };
        window.__positionConditionTypeMenu = function(triggerId, menuId) {
            var trigger = document.getElementById(triggerId);
            var menu = document.getElementById(menuId);
            if (!trigger || !menu) return;
            var r = trigger.getBoundingClientRect();
            menu.style.position = 'fixed';
            menu.style.top = (r.bottom + 4) + 'px';
            menu.style.left = r.left + 'px';
            menu.style.width = Math.max(r.width, 280) + 'px';
            menu.style.minWidth = Math.max(r.width, 280) + 'px';
        };
        window.positionConditionTypeMenu = window.__positionConditionTypeMenu;
        (function() {
            if (window.__diagramPointerTrackerInstalled) return;
            window.__diagramPointerTrackerInstalled = true;
            window.__diagramPointerButtons = 0;
            var sync = function(e) { window.__diagramPointerButtons = e.buttons; };
            document.addEventListener('pointerdown', sync, true);
            document.addEventListener('pointermove', sync, true);
            document.addEventListener('pointerup', sync, true);
            document.addEventListener('pointercancel', sync, true);
        })();
        window.__releaseDiagramPointerDragCore = function() {
            var root = document.getElementById('designer-canvas-area');
            var target = root ? root.querySelector('.designer-canvas') : null;
            if (!target) target = root;
            if (!target) return;
            var rect = target.getBoundingClientRect();
            var cx = rect.left + rect.width / 2;
            var cy = rect.top + rect.height / 2;
            var opts = {
                bubbles: true,
                cancelable: true,
                clientX: cx,
                clientY: cy,
                button: 0,
                buttons: 0,
                pointerId: 1,
                pointerType: 'mouse',
                view: window
            };
            try {
                target.dispatchEvent(new PointerEvent('pointercancel', opts));
                target.dispatchEvent(new PointerEvent('pointerup', opts));
            } catch (e) {
                target.dispatchEvent(new MouseEvent('mouseup', {
                    bubbles: true,
                    cancelable: true,
                    clientX: cx,
                    clientY: cy,
                    button: 0,
                    buttons: 0,
                    view: window
                }));
            }
        };
        window.__releaseDiagramPointerDragDeferred = function() {
            requestAnimationFrame(function() {
                requestAnimationFrame(function() {
                    setTimeout(function() {
                        var b = window.__diagramPointerButtons;
                        if (typeof b === 'number' && (b & 1) !== 0)
                            return;
                        window.__releaseDiagramPointerDragCore();
                    }, 0);
                });
            });
        };
        window.__releaseDiagramPointerDrag = window.__releaseDiagramPointerDragDeferred;
        window.__cdChatGetScrollState = function(id) {
            var el = document.getElementById(id);
            if (!el) return null;
            return { scrollHeight: el.scrollHeight, scrollTop: el.scrollTop };
        };
        window.__cdChatRestoreScroll = function(id, prevHeight, prevTop) {
            setTimeout(function() {
                var el = document.getElementById(id);
                if (el && prevHeight !== undefined) el.scrollTop = prevTop + (el.scrollHeight - prevHeight);
            }, 0);
        };
        window.__cdChatScrollToBottomInstant = function(id) {
            var el = document.getElementById(id);
            if (el) el.scrollTop = el.scrollHeight;
        };
        window.__cdChatSetupScrollLoadMore = function(id, dotNetRef) {
            var el = document.getElementById(id);
            if (!el || el._cdChatScrollAttached) return;
            el._cdChatScrollAttached = true;
            el._cdChatDotNetRef = dotNetRef;
            var lastCall = 0;
            var handler = function() {
                if (el.scrollTop > 80) return;
                var ref = el._cdChatDotNetRef;
                if (!ref) return;
                var now = Date.now();
                if (now - lastCall < 800) return;
                lastCall = now;
                ref.invokeMethodAsync('OnScrollNearTopAsync');
            };
            el._cdChatScrollHandler = handler;
            el.addEventListener('scroll', handler, { passive: true });
        };
        window.__cdChatTeardownScrollLoadMore = function(id) {
            var el = document.getElementById(id);
            if (!el || !el._cdChatScrollAttached) return;
            el.removeEventListener('scroll', el._cdChatScrollHandler);
            el._cdChatScrollHandler = null;
            el._cdChatDotNetRef = null;
            el._cdChatScrollAttached = false;
        };
        window.scrollToBottom = function(el) {
            if (el) el.scrollTop = el.scrollHeight;
        };
        window.__cfLcAutoResize = function(textarea) {
            textarea.style.height = 'auto';
            var lineH = parseFloat(getComputedStyle(textarea).lineHeight) || 22;
            var maxH = lineH * 5;
            textarea.style.height = Math.min(textarea.scrollHeight, maxH) + 'px';
        };
        window.__cfLcResetTextareaHeight = function(textarea) {
            textarea.style.height = 'auto';
        };
        window.__cfLcResetTextareaAndClear = function(textarea) {
            textarea.value = '';
            textarea.style.height = 'auto';
        };
        window.__getUserTimezone = function() {
            try { return Intl.DateTimeFormat().resolvedOptions().timeZone; }
            catch (e) { return "UTC"; }
        };
        window.__getTimezoneOffsets = function(timezonesJson) {
            var tzList = JSON.parse(timezonesJson);
            var result = {};
            var now = new Date();
            var utcStr = now.toLocaleString('en-US', { timeZone: 'UTC' });
            var utcDate = new Date(utcStr);
            for (var i = 0; i < tzList.length; i++) {
                var tz = tzList[i];
                try {
                    var tzStr = now.toLocaleString('en-US', { timeZone: tz });
                    var tzDate = new Date(tzStr);
                    var diff = Math.round((tzDate - utcDate) / 60000);
                    var sign = diff >= 0 ? '+' : '-';
                    diff = Math.abs(diff);
                    var h = Math.floor(diff / 60);
                    var m = diff % 60;
                    result[tz] = m > 0 ? sign + h + ':' + String(m).padStart(2, '0') : sign + h;
                } catch (e) {
                    result[tz] = '+0';
                }
            }
            return JSON.stringify(result);
        };
    </script>
</body>

</html>

  freellmapi-service:
    container_name: freellmapi_service
    image: ghcr\.io/grom1101/chatfoundry/freellmapi-service:latest
    build:
      context: ../services/FreeLlmApiService
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3001
      - ENCRYPTION_KEY=${FREELLM_ENCRYPTION_KEY}
    ports:
      - "3001:3001"
    volumes:

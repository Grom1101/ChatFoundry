# ==========================================
# 8. FreeLLM API Service (Replicas: 2)
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: freellmapi-service
  namespace: chatfoundry
  labels:
    app: freellmapi-service
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 3001
    targetPort: 3001
  selector:
    app: freellmapi-service

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: freellmapi-service
  namespace: chatfoundry
  labels:
    app: freellmapi-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: freellmapi-service
  template:
    metadata:
      labels:
        app: freellmapi-service
    spec:
      containers:
      - name: freellmapi-service
        image: ghcr\.io/grom1101/chatfoundry/freellmapi-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3001
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3001"
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: chatfoundry-secrets
              key: FREELLM_ENCRYPTION_KEY
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi

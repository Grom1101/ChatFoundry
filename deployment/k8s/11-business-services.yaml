# ==========================================
# 1. Workflow Service (Replicas: 2)
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: workflow-service
  namespace: chatfoundry
  labels:
    app: workflow-service
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: grpc
    port: 8081
    targetPort: 8081
  selector:
    app: workflow-service

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-service
  namespace: chatfoundry
  labels:
    app: workflow-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: workflow-service
  template:
    metadata:
      labels:
        app: workflow-service
    spec:
      containers:
      - name: workflow-service
        image: ghcr\.io/grom1101/chatfoundry/workflow-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        - name: grpc
          containerPort: 8081
        envFrom:
        - configMapRef:
            name: chatfoundry-common-config
        env:
        - name: ConnectionStrings__DefaultConnection
          value: "Host=postgres;Port=5432;Database=foundry_db_workflow;Username=foundry;Password=foundry"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 384Mi
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10

---

    env_file:
      - .env
    ports:
      - "5080:8080"
    depends_on:
      notification-db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app_network

  notification-db:
    image: postgres:16
    container_name: notification_db
    restart: always
    environment:
      POSTGRES_DB: foundry_db
      POSTGRES_USER: foundry
      POSTGRES_PASSWORD: foundry
    ports:
      - "5440:5432"
    volumes:
      - notification_pgdata:/var/lib/postgresql/data
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    networks:

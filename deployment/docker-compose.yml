    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundry -d foundry_db"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

  scheduler-service:
    container_name: scheduler_service
    build:
      context: ..
      dockerfile: services/SchedulerService/src/SchedulerService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080;http://+:8081
      - ASPNETCORE_Kestrel__Endpoints__Http__Url=http://+:8080
      - ASPNETCORE_Kestrel__Endpoints__Http__Protocols=Http1
      - ASPNETCORE_Kestrel__Endpoints__Grpc__Url=http://+:8081
      - ASPNETCORE_Kestrel__Endpoints__Grpc__Protocols=Http2
    ports:
      - "5090:8080"
      - "5091:8081"
    depends_on:
      scheduler-db:
        condition: service_healthy
    networks:
      - app_network

  scheduler-db:
    image: postgres:16
    container_name: scheduler_db
    restart: always
    environment:
      POSTGRES_DB: foundry_db
      POSTGRES_USER: foundry
      POSTGRES_PASSWORD: foundry
    ports:
      - "5441:5432"
    volumes:
      - scheduler_pgdata:/var/lib/postgresql/data
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundry -d foundry_db"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis
    container_name: redis
    restart: always
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    networks:
      - app_network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - app_network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - app_network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - app_network

#  ngrok:
#    image: ngrok/ngrok:latest
#    restart: unless-stopped
#    ports:
#      - "4040:4040"
#    depends_on:
#      - gateway-service
#    env_file:
#      - .env
#    command: http "https://gateway-service:8443" --domain probable-dogfish-known.ngrok-free.app
#    networks:
#      - app_network

  seq:
    image: datalust/seq:latest
    container_name: seq
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=YourPassword123!
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data
    networks:
      - app_network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - app_network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - app_network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger
    networks:
      - app_network

  freellmapi-service:
    container_name: freellmapi_service
    build:
      context: ../services/FreeLlmApiService
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3001
      - ENCRYPTION_KEY=${FREELLM_ENCRYPTION_KEY}
    ports:
      - "3001:3001"
    volumes:
      - freellmapi_data:/app/server/data
    networks:
      - app_network

volumes:
  seq_data:
  prometheus_data:
  grafana_data:
  identitydata:
  workflow_pgdata:
  client_pgdata:
  company_pgdata:
  file_pgdata:
  billing_pgdata:
  notification_pgdata:
  scheduler_pgdata:
  redis:
  freellmapi_data:

networks:
  app_network:
    driver: bridge

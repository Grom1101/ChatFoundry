syntax = "proto3";

option csharp_namespace = "Workflow.Grpc.Client";

package workflow.client;

import "google/protobuf/wrappers.proto";

service ClientAttributesService {
  rpc GetClientAttributes (GetClientAttributesRequest) returns (GetClientAttributesResponse);
  rpc SetClientAttributes (SetClientAttributesRequest) returns (SetClientAttributesResponse);
  rpc GetClientsByFilter (GetClientsByFilterRequest) returns (GetClientsByFilterResponse);
  rpc GetClientChannel (GetClientChannelRequest) returns (GetClientChannelResponse);
}

// --- Get ---

message GetClientAttributesRequest {
  string external_user_id = 1;
  string channel = 2;
  string channel_id = 3;
}

message GetClientAttributesResponse {
  BaseAttributes base_attributes = 1;
  map<string, string> custom_attributes = 2;
  string client_channel_id = 3;
}

// --- Set ---

message SetClientAttributesRequest {
  string external_user_id = 1;
  string channel = 2;
  BaseAttributes base_attributes = 3;
  map<string, string> custom_attributes = 4;
  string channel_id = 5;
}

message BaseAttributes {
  google.protobuf.StringValue name = 1;
  google.protobuf.StringValue username = 2;
  google.protobuf.StringValue phone = 3;
  google.protobuf.StringValue email = 4;
}

message SetClientAttributesResponse {
  bool success = 1;
}

// --- Filter ---

message GetClientsByFilterRequest {
  string company_id = 1;
  repeated string client_ids = 2;
  repeated ClientAttributeFilterCondition attribute_conditions = 3;
  repeated int32 channels = 4;
  repeated string channel_ids = 5;
  string conditions_logic = 6; // "and" or "or"
}

message ClientAttributeFilterCondition {
  string attribute_key = 1;
  string operator = 2;
  string value = 3;
  optional bool ignore_case = 4;
}

message GetClientsByFilterResponse {
  repeated FilteredClient clients = 1;
}

message FilteredClient {
  string external_user_id = 1;
  int32 channel = 2;
  string channel_id = 3;
}

message GetClientChannelRequest {
  string client_channel_id = 1;
}

message GetClientChannelResponse {
  string id = 1;
  string channel = 2;
  string channel_id = 3;
  string external_user_id = 4;
}

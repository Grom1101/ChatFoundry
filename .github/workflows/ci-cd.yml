name: Continuous Integration & Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'services/**'
      - 'shared/**'
      - 'webApps/**'
      - 'deployment/**'
      - '.github/workflows/**'
      - '*.sln'
      - 'global.json'
  pull_request:
    branches: [ main ]
    paths:
      - 'services/**'
      - 'shared/**'
      - 'webApps/**'
      - 'deployment/**'
      - '.github/workflows/**'
      - '*.sln'
      - 'global.json'
  release:
    types: [ published ]

permissions:
  contents: read
  packages: write

jobs:
  format-check:
    name: Verify Code Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Solution
        run: dotnet restore ChatFoundry.sln

      - name: Verify Formatting
        run: dotnet format ChatFoundry.sln --verify-no-changes --no-restore

  test-unit-services:
    name: Run C# Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Solution
        run: dotnet restore ChatFoundry.sln

      - name: Run Unit Tests
        run: dotnet test ChatFoundry.sln --configuration Release --no-restore --filter "FullyQualifiedName!~IntegrationTests"

  test-integration-services:
    name: Test ${{ matrix.service.name }} (Integration)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [
          { name: "BillingService", path: "services/BillingService/tests/BillingService.IntegrationTests/BillingService.IntegrationTests.csproj" },
          { name: "ClientService", path: "services/ClientService/tests/ClientService.IntegrationTests/ClientService.IntegrationTests.csproj" },
          { name: "CompanyService", path: "services/CompanyService/tests/CompanyService.IntegrationTests/CompanyService.IntegrationTests.csproj" },
          { name: "FileService", path: "services/FileService/tests/FileService.IntegrationTests/FileService.IntegrationTests.csproj" },
          { name: "Gateway", path: "services/Gateway/tests/Gateway.IntegrationTests/Gateway.IntegrationTests.csproj" },
          { name: "IdentityServer", path: "services/IdentityServer/tests/IdentityServer.IntegrationTests/IdentityServer.IntegrationTests.csproj" },
          { name: "NotificationService", path: "services/NotificationService/tests/NotificationService.IntegrationTests/NotificationService.IntegrationTests.csproj" },
          { name: "SchedulerService", path: "services/SchedulerService/tests/SchedulerService.IntegrationTests/SchedulerService.IntegrationTests.csproj" },
          { name: "TelegramService", path: "services/TelegramService/tests/TelegramService.IntegrationTests/TelegramService.IntegrationTests.csproj" },
          { name: "WorkflowService", path: "services/WorkflowService/tests/WorkflowService.IntegrationTests/WorkflowService.IntegrationTests.csproj" }
        ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Project
        run: dotnet restore ${{ matrix.service.path }}

      - name: Build Project
        run: dotnet build ${{ matrix.service.path }} --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test ${{ matrix.service.path }} --configuration Release --no-build --no-restore --verbosity normal

  test-node-service:
    name: Test Node.js LLM Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/FreeLlmApiService
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: services/FreeLlmApiService/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: npm run test -w server

  build-frontend:
    name: Build Blazor Client Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore BlazorClient
        run: dotnet restore webApps/src/BlazorClient/BlazorClient.csproj

      - name: Build BlazorClient
        run: dotnet build webApps/src/BlazorClient/BlazorClient.csproj --configuration Release --no-restore

  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [format-check, test-unit-services, test-integration-services, test-node-service, build-frontend]
    if: github.event_name == 'release' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    strategy:
      fail-fast: false
      matrix:
        service: [
          { name: "gateway", path: "services/Gateway/src/Gateway/Dockerfile", context: "." },
          { name: "workflow-service", path: "services/WorkflowService/src/WorkflowService/Dockerfile", context: "." },
          { name: "identity-service", path: "services/IdentityServer/src/IdentityServer/Dockerfile", context: "." },
          { name: "client-service", path: "services/ClientService/src/ClientService/Dockerfile", context: "." },
          { name: "telegram-service", path: "services/TelegramService/src/TelegramService/Dockerfile", context: "." },
          { name: "company-service", path: "services/CompanyService/src/CompanyService/Dockerfile", context: "." },
          { name: "billing-service", path: "services/BillingService/src/BillingService/Dockerfile", context: "." },
          { name: "file-service", path: "services/FileService/src/FileService/Dockerfile", context: "." },
          { name: "notification-service", path: "services/NotificationService/src/NotificationService/Dockerfile", context: "." },
          { name: "scheduler-service", path: "services/SchedulerService/src/SchedulerService/Dockerfile", context: "." },
          { name: "sms-service", path: "services/SmsService/src/SmsService/Dockerfile", context: "." },
          { name: "web-client", path: "webApps/src/BlazorClient/Dockerfile", context: "." },
          { name: "freellmapi-service", path: "services/FreeLlmApiService/Dockerfile", context: "services/FreeLlmApiService" }
        ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lower case owner name
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Set up Docker registry mirrors (Russia/connectivity workaround)
        run: |
          if [ -f /etc/docker/daemon.json ]; then
            sudo jq '. + {"registry-mirrors": ["https://dockerhub.timeweb.cloud", "https://huecker.io", "https://mirror.gcr.io"]}' /etc/docker/daemon.json > /tmp/daemon.json
            sudo mv /tmp/daemon.json /etc/docker/daemon.json
          else
            echo '{"registry-mirrors": ["https://dockerhub.timeweb.cloud", "https://huecker.io", "https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          fi
          sudo systemctl restart docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["dockerhub.timeweb.cloud", "huecker.io", "mirror.gcr.io"]

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER_LC }}/chatfoundry/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=,suffix=,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

